<html lang="en">

<head>
    <title>Syncfusion Javascript Modern Editor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript UI Controls">
    <meta name="author" content="Syncfusion">
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-base/styles/tailwind3.css" rel="stylesheet" />
    
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-inputs/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-navigations/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-popups/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-splitbuttons/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/ej2-richtexteditor-ui/styles/tailwind3.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.19.38/system.js"></script>
    <script src="systemjs.config.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            color: #333;
        }

        .demo-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .event-dashboard {
            margin-top: 15px;
            padding: 12px 20px;
            background: #f8f9fa;
            border: 1px dashed #ced4da;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #event-log {
            font-weight: bold;
            background-color: #e3f2fd;
            color: #0d6efd;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>

</head>

<body>
    <!-- Your Modern Rich Text Editor container -->
    <div id='loader'>Loading....</div>
    <div id='container'>
        <div class="external-toolbar">
            <button id="boldBtn">Bold</button>
            <button id="underlineBtn">Underline</button>
            <button id="fontSizeBtn">18px Font Size</button>
            <button id="fontColorBtn">Blue Font Color</button>
            <button id="highlightBtn">Highlight</button>
            <button id="clearFormatBtn">Clear Format</button>
        </div>
        <div id='editor'></div>
        <div class="event-dashboard">
            <span id="event-log">Action: Waiting for input...</span>
        </div>
    </div>
</body>
<script type="module" src="index.ts"></script>

</html>
