<!DOCTYPE html>
<html lang="en">

<head>
    <title>Syncfusion Javascript Modern Editor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Javascript UI Controls">
    <meta name="author" content="Syncfusion">
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-base/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-inputs/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-navigations/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-popups/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-splitbuttons/styles/tailwind3.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/35.1.37/ej2-richtexteditor-ui/styles/tailwind3.css" rel="stylesheet" />
    <link href="index.css" rel="stylesheet" />

    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
</head>

<body>
    <!-- Your Modern Rich Text Editor container -->
    <div id="container">
        <div id="editor"></div>
        <div class="event-dashboard">
            <span id="event-log">Action: Waiting for input...</span>
            <span id="affected-node" class="badge">Affected Element: None</span>
        </div>
    </div>

    <script src="index.js" type="text/javascript"></script>
</body>

</html>
