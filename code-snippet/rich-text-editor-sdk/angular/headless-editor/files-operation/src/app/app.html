<div class="control-section">
    <div class="file-ops-panel">
        <div class="file-ops-row">
            <button id="select-button" type="button" class="e-btn e-outline"
                (click)="onSelectFile(fileInput)">
                Select File
            </button>
            <span id="file-info" class="file-ops-info">{{ fileInfo }}</span>
            <input id="file-input" #fileInput type="file" accept="image/*" style="display:none"
                (change)="onFileSelected($event)" />
        </div>
        <div class="file-ops-row">
            <button id="upload-button" type="button" class="e-btn e-outline" [disabled]="uploadDisabled"
                (click)="onUpload()">
                Upload
            </button>
            <button id="insert-button" type="button" class="e-btn e-outline" [disabled]="insertDisabled"
                (click)="onInsert()">
                Insert
            </button>
            <button id="cancel-button" type="button" class="e-btn e-outline" [disabled]="cancelDisabled"
                (click)="onCancel()">
                Cancel
            </button>
        </div>
        <div class="file-ops-row">
            <div class="file-ops-progress-track">
                <div id="progress-bar" class="file-ops-progress-bar" [class]="progressState"
                    [style.width]="progressWidth"></div>
            </div>
            <span id="progress-text" class="file-ops-info">{{ progressText }}</span>
        </div>
        <div id="status-message" class="file-ops-status">{{ statusMessage }}</div>
    </div>

    <div class="headless-editor-surface">
        <div id="editor" #editor></div>
    </div>
</div>
